<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>alshka | PS4 Exploit</title>
<style>
  html, body { margin:0; padding:0; background:#0b0d10; color:#c8ced8;
               font:15px/1.5 "Segoe UI", system-ui, Tahoma, Arial, sans-serif; }
  #wrap { padding:18px 20px; }
  #state { font-size:22px; font-weight:700; margin:0 0 8px; }
  #det { font-size:13px; color:#8b95a3; margin:0 0 6px; }
  #det b { color:#c8ced8; font-weight:600; }
  #cache { font-size:12px; color:#5c6672; margin:0 0 14px; min-height:14px; }
  #cache.cacheok { color:#7fd0a0; }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  #brand { display:flex; align-items:center; justify-content:space-between;
           flex-wrap:wrap; gap:12px; padding:12px 20px; background:#0e1116;
           border-bottom:1px solid #1e2732; }
  .brand-profile { display:flex; align-items:center; gap:12px; }
  .brand-avatar { width:46px; height:46px; border-radius:50%; object-fit:cover;
                  border:2px solid #7fd0a0; box-shadow:0 0 12px rgba(127,208,160,0.3); }
  .brand-titles { display:flex; flex-direction:column; }
  .brand-name { font-size:18px; font-weight:700; letter-spacing:.06em; color:#ffffff; }
  .brand-tag { font-size:11px; color:#7fd0a0; font-weight:600; }
  .tiktok-box { display:inline-flex; align-items:center; gap:8px; background:#141922;
                border:1px solid #232e3d; padding:6px 14px; border-radius:24px;
                font-size:13px; color:#c8ced8; box-shadow:0 2px 8px rgba(0,0,0,0.3); }
  .tiktok-box svg { width:15px; height:15px; fill:#ee1d52; }
  .tiktok-box b { color:#ffffff; font-weight:700; }
  .footer-creds { margin-top:28px; padding-top:12px; border-top:1px solid #18202b;
                  font-size:12px; color:#5c6672; text-align:center; }
  .footer-creds b { color:#8b95a3; }
</style>
</head>
<body>
<div id="brand">
  <div class="brand-profile">
    <img src="logo.jpg" alt="alshka" class="brand-avatar" />
    <div class="brand-titles">
      <span class="brand-name">alshka</span>
      <span class="brand-tag">PS4 Exploit Host</span>
    </div>
  </div>
  <div class="tiktok-box">
    <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.89 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.92a6.34 6.34 0 0 0-.79-.05A6.33 6.33 0 0 0 3 16.2a6.33 6.33 0 0 0 6.34 6.33 6.33 6.33 0 0 0 6.33-6.33V9.08a8.28 8.28 0 0 0 4.92 1.61V7.24a4.83 4.83 0 0 1-1-.55z"/></svg>
    <span>alshka : tiktok <b>mkd.55</b></span>
  </div>
</div>
<div id="wrap">
  <div id="state">جارٍ فحص إصدار النظام...</div>
  <div id="det"></div>
  <div id="cache"></div>
  <div class="footer-creds">
    alshka &middot; tiktok : <b>mkd.55</b>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "إصدار النظام <b>" + (key || "غير معروف") + "</b>"
        + (supported ? " &middot; <b>مدعوم</b>"
                     : " &middot; غير موجود في جدول الكيرنل لهذا الإصدار");

    var target = "jb.html" + location.search;
    function go() { setState("جارٍ تشغيل الجيلبريك...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("إصدار نظام غير مدعوم", "bad");
        waitForTap("غير مدعوم (" + (key || "غير معروف") + ") -- اضغط X أو انقر للتشغيل على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("بدون اتصال -- من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("محفوظ في الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث", true);
        waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جارٍ فحص الذاكرة المؤقتة...");
        ac.addEventListener("downloading",
            function () { setCache("جارٍ الحفظ للتشغيل بدون إنترنت (المرة الأولى)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جارٍ الحفظ " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم الحفظ للاستخدام بدون إنترنت", true);
            waitForTap("تم الحفظ بنجاح -- اضغط X أو انقر للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("error", function () {
            // Manifest 404 / network fail: still launch, we may already have it
            // or the network may just be down.
            go();
        }, false);
    }
})();
</script>
</body>
</html>
