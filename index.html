<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALSHKA | PS4 Host</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090b0e;
    color: #c8ced8;
    font: 15px/1.5 "Segoe UI", Tahoma, Arial, system-ui, sans-serif;
    direction: rtl;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Header & Profile */
  #header {
    background: linear-gradient(180deg, #11161f 0%, #0c0f14 100%);
    border-bottom: 1px solid #1c2533;
    padding: 18px 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  .profile-container {
    max-width: 580px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .avatar-ring {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(135deg, #00f2fe 0%, #fe2c55 100%);
    box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
    flex-shrink: 0;
  }
  .avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #0c0f14;
  }
  .site-identity {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
  }
  .site-title {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #ffffff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }
  .tiktok-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: #141a24;
    border: 1px solid #243144;
    padding: 4px 12px;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .tiktok-icon {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
  }
  .tiktok-label {
    font-size: 12px;
    color: #8fa0b5;
  }
  .tiktok-username {
    font-size: 13px;
    font-weight: 700;
    color: #00f2fe;
    direction: ltr;
    letter-spacing: 0.03em;
  }

  /* Main Container */
  #main-content {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  #wrap {
    width: 100%;
    max-width: 540px;
    background: #10141b;
    border: 1px solid #1c2636;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
    text-align: right;
  }
  #state {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 12px;
    line-height: 1.4;
    color: #e6ecf5;
  }
  #det {
    font-size: 14px;
    color: #8b97a8;
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid #182230;
    line-height: 1.6;
  }
  #det b {
    color: #ffffff;
  }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-ok {
    background: rgba(127, 208, 160, 0.15);
    color: #7fd0a0;
    border: 1px solid rgba(127, 208, 160, 0.35);
  }
  .badge-bad {
    background: rgba(208, 138, 127, 0.15);
    color: #d08a7f;
    border: 1px solid rgba(208, 138, 127, 0.35);
  }
  #cache {
    font-size: 13px;
    color: #647285;
    min-height: 18px;
  }
  #cache.cacheok {
    color: #7fd0a0;
    font-weight: 500;
  }

  .ok { color: #7fd0a0; }
  .bad { color: #d08a7f; }
  .warn { color: #f5c76c; }

  /* Footer */
  #footer {
    background: #090c10;
    border-top: 1px solid #161e2a;
    padding: 14px 16px;
    text-align: center;
    font-size: 12px;
    color: #616e80;
  }
  .footer-inner {
    max-width: 580px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .footer-inner span b {
    color: #9db0c6;
  }
  .footer-sep {
    color: #2a374a;
  }
</style>
</head>
<body>

<header id="header">
  <div class="profile-container">
    <div class="avatar-ring">
      <img src="logo.jpg" alt="ALSHKA" class="avatar-img">
    </div>
    <div class="site-identity">
      <h1 class="site-title">ALSHKA</h1>
      <div class="tiktok-badge">
        <svg class="tiktok-icon" viewBox="0 0 24 24">
          <path fill="#00f2fe" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.27 1.76-.23.99-.04 2.09.6 2.89.65.84 1.72 1.33 2.77 1.29 1.1-.01 2.14-.62 2.67-1.59.3-.54.43-1.16.44-1.77.03-3.68.01-7.37.02-11.05z"/>
        </svg>
        <span class="tiktok-label">تيك توك:</span>
        <span class="tiktok-username">@MKD.55</span>
      </div>
    </div>
  </div>
</header>

<main id="main-content">
  <div id="wrap">
    <div id="state">جاري التحقق من إصدار النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
  </div>
</main>

<footer id="footer">
  <div class="footer-inner">
    <span>موقع <b>ALSHKA</b> لتشغيل الجيلبريك</span>
    <span class="footer-sep">&bull;</span>
    <span>الحقوق محفوظة: <b>MKD.55</b></span>
  </div>
</footer>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "إصدار النظام: <b>" + (key || "غير معروف") + "</b> &middot; "
        + (supported ? "<span class='badge badge-ok'>مدعوم</span>"
                     : "<span class='badge badge-bad'>غير مدرج في جدول الكيرنل</span>");

    var target = "jb.html" + location.search;
    function go() { setState("جاري تحميل الجيلبريك...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        setState("إصدار النظام غير مدعوم", "bad");
        waitForTap("غير مدعوم (" + (key || "غير معروف") + ") -- اضغط X أو انقر للتشغيل على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع العمل بدون إنترنت -- يعمل من الذاكرة المؤقتة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("تم التخزين في الذاكرة المؤقتة بنجاح", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث بنجاح", true);
        waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جاري فحص الذاكرة المؤقتة...");
        ac.addEventListener("downloading",
            function () { setCache("جاري حفظ الملفات للعمل بدون إنترنت (التشغيل الأول)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جاري الحفظ " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم الحفظ بنجاح للعمل بدون إنترنت", true);
            waitForTap("تم التخزين (التشغيل الأول) -- اضغط X أو انقر للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث بنجاح", true);
            waitForTap("التحديث جاهز -- اضغط X أو انقر لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("مخزن مؤقتاً -- جاهز للاستخدام بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("تعذر الوصول للذاكرة المؤقتة");
            waitForTap("فشل التخزين المؤقت -- اضغط X أو انقر للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الذاكرة المؤقتة قديمة");
            waitForTap("الذاكرة المؤقتة قديمة -- اضغط X أو انقر للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
