<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ALSHKA | تشغيل الجيلبريك</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #090b0e;
        color: #c8ced8;
        font: 15px/1.5 "Segoe UI", Tahoma, Arial, system-ui, sans-serif;
        direction: rtl;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* Header & Profile */
      #header {
        background: linear-gradient(180deg, #11161f 0%, #0c0f14 100%);
        border-bottom: 1px solid #1c2533;
        padding: 18px 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      }
      .profile-container {
        max-width: 580px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .avatar-ring {
        position: relative;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        padding: 2px;
        background: linear-gradient(135deg, #00f2fe 0%, #fe2c55 100%);
        box-shadow: 0 0 14px rgba(0, 242, 254, 0.35);
        flex-shrink: 0;
      }
      .avatar-img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
        display: block;
        background: #0c0f14;
      }
      .site-identity {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }
      .site-title {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: #ffffff;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      }
      .tiktok-badge {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #141a24;
        border: 1px solid #243144;
        padding: 4px 12px;
        border-radius: 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }
      .tiktok-icon {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }
      .tiktok-label {
        font-size: 12px;
        color: #8fa0b5;
      }
      .tiktok-username {
        font-size: 13px;
        font-weight: 700;
        color: #00f2fe;
        direction: ltr;
        letter-spacing: 0.03em;
      }

      /* Spinner & Exploit status */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border: 4px solid #1c2636;
        border-top-color: #00f2fe;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 17px;
        line-height: 1.6;
        display: none;
        padding: 20px;
      }
      .msg-box {
        display: inline-block;
        max-width: 440px;
        background: #151a24;
        border: 1px solid #d08a7f;
        border-radius: 12px;
        padding: 20px 24px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      }
      .msg-title {
        font-size: 20px;
        font-weight: 700;
        color: #d08a7f;
        margin-bottom: 8px;
      }
      .msg-sub {
        font-size: 14px;
        color: #8fa0b5;
      }

      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 16px 20px;
        direction: ltr;
        text-align: left;
      }
      body.log #state {
        display: block;
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.45 Consolas, monospace;
        background: #10141b;
        border: 1px solid #1c2636;
        border-radius: 8px;
        padding: 12px 14px;
        height: calc(100vh - 190px);
        overflow-y: auto;
      }

      .ok { color: #7fd0a0; }
      .bad { color: #d08a7f; }
      .warn { color: #f5c76c; }

      /* Footer */
      #footer {
        background: #090c10;
        border-top: 1px solid #161e2a;
        padding: 14px 16px;
        text-align: center;
        font-size: 12px;
        color: #616e80;
      }
      .footer-inner {
        max-width: 580px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .footer-inner span b {
        color: #9db0c6;
      }
      .footer-sep {
        color: #2a374a;
      }
    </style>
  </head>
  <body>
    <header id="header">
      <div class="profile-container">
        <div class="avatar-ring">
          <img src="logo.jpg" alt="ALSHKA" class="avatar-img" />
        </div>
        <div class="site-identity">
          <h1 class="site-title">ALSHKA</h1>
          <div class="tiktok-badge">
            <svg class="tiktok-icon" viewBox="0 0 24 24">
              <path
                fill="#00f2fe"
                d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.27 1.76-.23.99-.04 2.09.6 2.89.65.84 1.72 1.33 2.77 1.29 1.1-.01 2.14-.62 2.67-1.59.3-.54.43-1.16.44-1.77.03-3.68.01-7.37.02-11.05z"
              />
            </svg>
            <span class="tiktok-label">تيك توك:</span>
            <span class="tiktok-username">@MKD.55</span>
          </div>
        </div>
      </div>
    </header>

    <div id="spin"></div>

    <div id="msg">
      <div class="msg-box">
        <div class="msg-title">يرجى إعادة تشغيل جهازك</div>
        <div class="msg-sub">Restart your console</div>
      </div>
    </div>

    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <footer id="footer">
      <div class="footer-inner">
        <span>موقع <b>ALSHKA</b> لتشغيل الجيلبريك</span>
        <span class="footer-sep">&bull;</span>
        <span>الحقوق محفوظة: <b>MKD.55</b></span>
      </div>
    </footer>

    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
