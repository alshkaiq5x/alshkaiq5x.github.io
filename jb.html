<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>alshka | PS4 Exploit</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.5 "Segoe UI",
          system-ui,
          Tahoma,
          Arial,
          sans-serif;
      }
      #brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        padding: 12px 20px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
      }
      .brand-profile {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-avatar {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #7fd0a0;
        box-shadow: 0 0 12px rgba(127, 208, 160, 0.3);
      }
      .brand-titles {
        display: flex;
        flex-direction: column;
      }
      .brand-name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #ffffff;
      }
      .brand-tag {
        font-size: 11px;
        color: #7fd0a0;
        font-weight: 600;
      }
      .tiktok-box {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #141922;
        border: 1px solid #232e3d;
        padding: 6px 14px;
        border-radius: 24px;
        font-size: 13px;
        color: #c8ced8;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
      .tiktok-box svg {
        width: 15px;
        height: 15px;
        fill: #ee1d52;
      }
      .tiktok-box b {
        color: #ffffff;
        font-weight: 700;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 46px;
        height: 46px;
        margin: -23px 0 0 -23px;
        border: 4px solid #1e2732;
        border-top-color: #7fd0a0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.5px;
        display: none;
        color: #d08a7f;
        font-weight: 600;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        direction: ltr;
        text-align: left;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <div class="brand-profile">
        <img src="logo.jpg" alt="alshka" class="brand-avatar" />
        <div class="brand-titles">
          <span class="brand-name">alshka</span>
          <span class="brand-tag">PS4 Exploit Host</span>
        </div>
      </div>
      <div class="tiktok-box">
        <svg viewBox="0 0 24 24"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.89 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.92a6.34 6.34 0 0 0-.79-.05A6.33 6.33 0 0 0 3 16.2a6.33 6.33 0 0 0 6.34 6.33 6.33 6.33 0 0 0 6.33-6.33V9.08a8.28 8.28 0 0 0 4.92 1.61V7.24a4.83 4.83 0 0 1-1-.55z"/></svg>
        <span>alshka : tiktok <b>mkd.55</b></span>
      </div>
    </div>
    <div id="spin"></div>
    <div id="msg">يرجى إعادة تشغيل جهازك</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
